<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dart – licznik z kamerą</title>
<style>
:root{--bg:#fff;--fg:#111;--card:#f0f0f0;--ac:#0a7d3b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121212;--fg:#eee;--card:#222;--ac:#3ddc84;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px system-ui,sans-serif;padding:8px}
canvas{width:100%;max-width:640px;background:#000;border-radius:8px;touch-action:manipulation}
.pl{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;margin:4px 0;border-radius:8px;background:var(--card);font-size:20px}.pl.on{outline:3px solid var(--ac)}.pl b{font-size:34px;color:var(--ac)}.pl i{cursor:pointer;margin-left:10px;opacity:.6;font-style:normal}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}
button{padding:10px 14px;border:0;border-radius:8px;background:var(--card);color:var(--fg);font-size:15px}
button.p{background:var(--ac);color:#000}
#msg{min-height:22px}
</style>
</head>
<body>
<canvas id="cv" width="640" height="480"></canvas>
<div id="msg">Start kamery…</div>
<div id="board"></div>
<div id="darts" style="margin:6px 0;min-height:22px"></div>
<div class="row"><input id="pn" placeholder="Imię gracza" style="padding:9px;border-radius:8px;border:1px solid #888;background:var(--card);color:var(--fg)"><button id="addp">+ Dodaj gracza</button></div>
<div class="row"><select id="bl"></select><button id="addb">🤖 Dodaj bota</button></div>
<div class="row">
<button class="p" id="cam">▶ Włącz kamerę</button>
<button id="phb">📷 Tryb zdjęć</button><input type="file" id="ph" accept="image/*" capture="environment" style="display:none">
<button class="p" id="cal">1. Kalibruj tarczę</button>
<button id="next">Następny gracz (ręcznie)</button>
<button id="undo">Cofnij lotkę</button>
<button id="reset">Nowa gra</button>
</div>
<div class="row">
<label>Gra do <select id="start"><option>301</option><option selected>501</option><option>701</option></select></label>
<label>Mecz do <select id="legs"><option value="1">1 lega</option><option value="2">2 legów</option><option value="3">3 legów</option><option value="4">4 legów</option><option value="5">5 legów</option></select></label>
<label><input type="checkbox" id="dout"> double-out</label>
<label><input type="checkbox" id="auto" checked> auto-wykrywanie (eksperyment)</label>
<label><input type="checkbox" id="voice" checked> głos</label>
</div>
<details><summary>🔊 Ustawienia głosu</summary>
<div class="row"><label>Język <select id="lang"><option value="pl">Polski</option><option value="en">Angielski (styl callera)</option></select></label>
<label>Głos <select id="vsel"></select></label></div>
<div class="row"><label>Tempo <input type="range" id="rate" min=".6" max="1.4" step=".05" value=".95"></label>
<label>Wysokość <input type="range" id="pitch" min=".6" max="1.4" step=".05" value="1"></label>
<label>Ekspresja <input type="range" id="expr" min="0" max="100" step="5" value="80"></label></div>
<div class="row"><label>Własne nagrania <input type="file" id="pk" multiple accept="audio/*"></label><button id="tv">Test głosu</button></div>
<small>Pliki nazwij: 0.mp3 … 180.mp3, bust.mp3, gameshot.mp3 (brakujące mówi lektor). Pliki zostają tylko w Twojej przeglądarce.</small>
</details>
<video id="v" playsinline muted style="display:none"></video>
<script>
const SEG=[20,1,18,4,13,6,10,15,2,17,3,19,7,16,8,11,14,9,12,5];
const $=id=>document.getElementById(id), cv=$('cv'), ctx=cv.getContext('2d',{willReadFrequently:true}), v=$('v');
let mode='cal', calPts=[], cal=null, ref=null, base=null, lastN=0, stable=0, darts=[], lastD=null, prevG=null;
let players=[{n:'Gracz 1',r:501,l:0,pts:0,nd:0,bot:0}], cur=0, turnStart=501, over=false, bust=false, won=false, legEnd=false, legStarter=0, pull=null;
let lastStat=null, botBusy=false, roi=new Int32Array(0);
const CALMSG=['Kalibracja 1/4: dotknij ZEWNĘTRZNEJ krawędzi pola DOUBLE 20 (górny środek tarczy).','Kalibracja 2/4: zewnętrzna krawędź pola DOUBLE 6 (prawa strona tarczy).','Kalibracja 3/4: zewnętrzna krawędź pola DOUBLE 3 (dół tarczy).','Kalibracja 4/4: zewnętrzna krawędź pola DOUBLE 11 (lewa strona tarczy).'];
const BP=[[0,-1],[1,0],[0,1],[-1,0]];
function homog(src,dst){
  const A=[];for(let i=0;i<4;i++){const[x,y]=src[i],[u,v]=dst[i];
    A.push([x,y,1,0,0,0,-u*x,-u*y,u]);A.push([0,0,0,x,y,1,-v*x,-v*y,v]);}
  for(let c=0;c<8;c++){let p=c;for(let r=c+1;r<8;r++)if(Math.abs(A[r][c])>Math.abs(A[p][c]))p=r;[A[c],A[p]]=[A[p],A[c]];
    for(let r=0;r<8;r++)if(r!==c){const f=A[r][c]/A[c][c];for(let k=c;k<9;k++)A[r][k]-=f*A[c][k];}}
  return A.map((r,i)=>r[8]/r[i]).slice(0,8);
}
function apply(H,x,y){const w=H[6]*x+H[7]*y+1;return[(H[0]*x+H[1]*y+H[2])/w,(H[3]*x+H[4]*y+H[5])/w];}
function buildRoi(){const a=[];for(let y=0;y<480;y++)for(let x=0;x<640;x++){const H=cal.H,w=H[6]*x+H[7]*y+1;if(w<=0)continue;
  const bx=(H[0]*x+H[1]*y+H[2])/w,by=(H[3]*x+H[4]*y+H[5])/w;if(bx*bx+by*by<=1.1)a.push(y*640+x);}roi=Int32Array.from(a);}
const LV=[null,[20,.05],[28,.08],[36,.12],[43,.16],[50,.20],[57,.22],[64,.235],[70,.25]];
const OPT=[{p:0,l:'pudło',d:false},{p:25,l:'25',d:false},{p:50,l:'bull',d:true}];
for(let i=1;i<=20;i++)OPT.push({p:i,l:''+i,d:false},{p:2*i,l:'double '+i,d:true},{p:3*i,l:'triple '+i,d:false});
const G=Array.from({length:3000},()=>{let u=0,v=0;while(!u)u=Math.random();v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);});
const gauss=()=>G[Math.random()*3000|0];
const MU={};
function muFor(l){if(MU[l])return MU[l];const m=LV[l][0]/3*1.2,sd=Math.min(18,5+m*.5);let lo=-40,hi=100;
  for(let it=0;it<14;it++){const mid=(lo+hi)/2;let t=0;for(let k=0;k<3000;k++)t+=Math.min(60,Math.max(0,mid+sd*G[k]));(t/3000<m?lo=mid:hi=mid);}
  return MU[l]=[(lo+hi)/2,sd];}
function near(t,maxP){let best=[],bd=1e9;for(const o of OPT){if(o.d||o.p>maxP)continue;const d=Math.abs(o.p-t);if(d<bd-1e-9){bd=d;best=[o];}else if(Math.abs(d-bd)<1e-9)best.push(o);}
  return{...best[Math.random()*best.length|0]};}
function botDart(P){
  const[avg,dbl]=LV[P.bot],rem=P.r-sum();
  if((rem<=40&&rem%2===0&&rem>=2)||rem===50){
    if(Math.random()<dbl)return rem===50?{p:50,l:'bull',d:true}:{p:rem,l:'double '+rem/2,d:true};
    if(Math.random()<.45){if(rem===50)return{p:25,l:'25',d:false};const h=rem/2;if(h>=2)return{p:h,l:''+h,d:false};}
    return{p:0,l:'pudło',d:false};}
  if(rem<=40&&rem%2===1&&rem>=3)return Math.random()<.7?{p:1,l:'1',d:false}:{p:0,l:'pudło',d:false};
  const[mu,sd]=muFor(P.bot);return near(Math.min(60,Math.max(0,mu+sd*gauss())),Math.max(0,rem-2));
}
function botTurn(){
  const P=players[cur]; if(!P||!P.bot||over||won||botBusy)return; botBusy=true;
  const step=()=>{ if(players[cur]!==P||over||won||darts.length>=3){botBusy=false;return;}
    registerDart(botDart(P)); if(!over&&darts.length<3)setTimeout(step,900); else botBusy=false; };
  setTimeout(step,300);
}
function stat(P,pts){P.pts+=pts;P.nd+=darts.length;lastStat={P,pts,nd:darts.length};}
const BOGEY=[159,162,163,165,166,168,169];
const startVal=()=>+$('start').value, target=()=>+$('legs').value;
const U=['zero','jeden','dwa','trzy','cztery','pięć','sześć','siedem','osiem','dziewięć','dziesięć','jedenaście','dwanaście','trzynaście','czternaście','piętnaście','szesnaście','siedemnaście','osiemnaście','dziewiętnaście'];
const T=['','','dwadzieścia','trzydzieści','czterdzieści','pięćdziesiąt','sześćdziesiąt','siedemdziesiąt','osiemdziesiąt','dziewięćdziesiąt'];
const H=['','sto','dwieście','trzysta','czterysta','pięćset','sześćset','siedemset','osiemset','dziewięćset'];
function words(n){ if(n<20)return U[n]; if(n<100)return T[n/10|0]+(n%10?' '+U[n%10]:''); return H[n/100|0]+(n%100?' '+words(n%100):''); }

const vc=document.createElement('canvas');vc.width=640;vc.height=480;const vctx=vc.getContext('2d',{willReadFrequently:true});
let photo=null, photoMode=false, started=false;
let sid=0, pack={}, curAudio=null;
const PL={code:'pl-PL',num:n=>words(n),zero:'zero',bust:'Przekroczone',req:n=>n+', zostało ci',leg:n=>n+' wygrywa lega',match:n=>n+' wygrywa mecz'};
const EN={code:'en-GB',num:n=>enWords(n),zero:'No score',bust:'Bust',req:n=>n+', you require',leg:n=>'Game shot, '+n,match:n=>'Game shot and the match, '+n};
const L=()=>$('lang').value==='en'?EN:PL;
function enWords(n){const u=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'],t=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
  if(n<20)return u[n]; if(n<100)return t[n/10|0]+(n%10?' '+u[n%10]:''); return u[n/100|0]+' hundred'+(n%100?' and '+enWords(n%100):'');}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
function prosody(it){
  const br=+$('rate').value, bp=+$('pitch').value, ex=$('expr').value/100;
  let rate=br, pitch=bp;
  if(it.tone==='low'){pitch=bp*(1-.15*ex);rate=br*.9;}
  else if(it.tone==='high'){pitch=bp*(1+.3*ex);rate=br;}
  else if(it.calm){pitch=bp*(1-.04*ex);rate=br*.95;}
  else if(it.num!==undefined){
    const t=it.num, lv=t/180;
    if(t===180){pitch=bp*(1+.55*ex);rate=br*.85;}
    else if(t<30){pitch=bp*(1-.15*ex);rate=br*.9;}
    else{pitch=bp*(1-.1*ex+.5*ex*lv);rate=br*(.95+.12*ex*lv);}
  }
  return{rate:clamp(rate,.1,2),pitch:clamp(pitch,0,2)};
}
function getVoice(){const n=$('vsel').value;return n?speechSynthesis.getVoices().find(v=>v.name===n):null;}
function tts(text,pr){return new Promise(res=>{
  if(!window.speechSynthesis)return res();
  const u=new SpeechSynthesisUtterance(text);u.lang=L().code;const v=getVoice();if(v)u.voice=v;
  u.rate=pr.rate;u.pitch=pr.pitch;u.onend=u.onerror=()=>res();speechSynthesis.speak(u);setTimeout(res,9000);});}
function playFile(url){return new Promise(res=>{const a=new Audio(url);curAudio=a;a.onended=a.onerror=()=>res();a.play().catch(()=>res());});}
async function speak(items){
  if(!$('voice').checked)return;
  const my=++sid; try{speechSynthesis.cancel();}catch(e){} if(curAudio){curAudio.pause();curAudio=null;}
  for(const it of items){
    if(my!==sid)return;
    const k=it.key||(it.num!==undefined?String(it.num):null);
    if(k&&pack[k]){await playFile(pack[k]);await sleep(80);continue;}
    let text=it.text!==undefined?it.text:(it.num===0?L().zero:L().num(it.num));
    if(!it.calm&&it.num>=100)text+='!';
    await tts(text,prosody(it)); await sleep(70);
  }
}
function say(t,items){ $('msg').textContent=t; if(items)speak(items); }
function popVoices(){
  if(!window.speechSynthesis)return;
  const p=L().code.slice(0,2), vs=speechSynthesis.getVoices().filter(v=>v.lang.toLowerCase().startsWith(p));
  $('vsel').innerHTML='<option value="">(domyślny)</option>'+vs.map(v=>'<option>'+v.name+'</option>').join('');
}
function info(t){$('msg').textContent=t}
const reqItems=r=>[{text:L().req(players[cur].n),calm:true},{num:r,calm:true}];
const sum=()=>darts.reduce((a,d)=>a+d.p,0);
function fin(r){ if(r>=2&&r<=170&&!BOGEY.includes(r)){const n=players[cur].n; return {d:n+', zostało ci '+r, s:n+', zostało ci '+words(r)};} return null; }

function score(x,y){
  const[bx,by]=apply(cal.H,x,y), r=Math.hypot(bx,by);
  if(!(r<=1))return{p:0,l:'poza tarczą',d:false};
  if(r<=0.0374)return{p:50,l:'bull',d:true};
  if(r<=0.0935)return{p:25,l:'25',d:false};
  let a=Math.atan2(bx,-by)*180/Math.PI; a=((a%360)+360)%360;
  const s=SEG[Math.floor(((a+9)%360)/18)];
  if(r>=0.953)return{p:2*s,l:'double '+s,d:true};
  if(r>=0.582&&r<=0.629)return{p:3*s,l:'triple '+s,d:false};
  return{p:s,l:String(s),d:false};
}

function addDart(x,y){ if(!cal||over||won||darts.length>=3||players[cur].bot)return; const s=score(x,y); s.x=x; s.y=y; registerDart(s); }
function registerDart(s){
  if(over||won||darts.length>=3)return; darts.push(s);
  const P=players[cur], r=P.r-sum();
  if(r<0||($('dout').checked&&(r===1||(r===0&&!s.d)))){
    bust=true;over=true;stat(P,0);startPull();render();const f=fin(P.r);
    say('Przekroczone!'+(f?' '+f.d:''),[{key:'bust',text:L().bust,tone:'low'}].concat(f?reqItems(P.r):[]));return;}
  if(r===0){
    P.r=0;P.l++;over=true;legEnd=true;stat(P,sum());
    if(P.l>=target()){won=true;say(P.n+' wygrywa mecz!',[{key:'gameshot',text:L().match(P.n),tone:'high'}]);}
    else{startPull();say(P.n+' wygrywa lega!',[{key:'gameshot',text:L().leg(P.n),tone:'high'}]);}
    render();return;}
  render();
  if(darts.length===3)endTurn();
}
function startPull(){if(players[cur].bot){pull=null;setTimeout(nextPlayer,2600);return;}if(photoMode){pull=null;return;}pull={moved:false,calm:0};prevG=null;}
function endTurn(){
  if(over)return; const P=players[cur], t=sum();
  P.r-=t; over=true; stat(P,t); startPull(); render();
  const f=fin(P.r);
  say(t+(f?' · '+f.d:''),[{num:t}].concat(f?reqItems(P.r):[]));
}
function liveRem(i){return (i===cur&&!over)?players[i].r-sum():players[i].r;}
const esc=t=>t.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function render(){
  $('board').innerHTML=players.map((p,i)=>'<div class="pl'+(i===cur?' on':'')+'"><span>'+esc(p.n)+' <small>legi: '+p.l+'/'+target()+' · śr. '+(p.nd?(p.pts/p.nd*3).toFixed(1):'–')+(p.bot?' · 🤖'+p.bot:'')+'</small></span><span><b>'+liveRem(i)+'</b>'+(players.length>1?'<i data-x="'+i+'">✕</i>':'')+'</span></div>').join('');
  $('darts').textContent=(bust?'PRZEKROCZONE · ':'')+darts.map(d=>d.l+' ('+d.p+')').join(' · ')+(darts.length?' = '+sum():'')+(pull?' · wyjmij lotki – zmiana nastąpi automatycznie':'');
}
function nextPlayer(){
  if(won)return;
  endTurn(); pull=null;
  if(legEnd){players.forEach(p=>p.r=startVal());legStarter=(legStarter+1)%players.length;cur=legStarter;legEnd=false;}
  else cur=(cur+1)%players.length;
  turnStart=players[cur].r; darts=[]; over=false; bust=false; lastStat=null; snap(); render();
  info('Rzuca: '+players[cur].n+' ('+players[cur].r+')');
  if(players[cur].bot)setTimeout(botTurn,1200);
}
function pullStep(){
  const g=gray();
  if(prevG){
    let c=0;for(let y=0;y<480;y+=4)for(let x=0;x<640;x+=4){const i=y*640+x;if(Math.abs(g[i]-prevG[i])>30)c++;}
    if(c>40){pull.moved=true;pull.calm=0;}else if(pull.moved)pull.calm++;
    if(pull.moved&&pull.calm>=8){prevG=null;nextPlayer();return;}
  }
  prevG=g;
}
$('addp').onclick=()=>{const n=$('pn').value.trim()||('Gracz '+(players.length+1));players.push({n,r:startVal(),l:0,pts:0,nd:0,bot:0});$('pn').value='';render();};
$('legs').onchange=render;
$('lang').onchange=popVoices;
$('bl').innerHTML=LV.slice(1).map((v,i)=>'<option value="'+(i+1)+'">Poziom '+(i+1)+' (śr. '+v[0]+', dbl '+Math.round(v[1]*1000)/10+'%)</option>').join('');
$('addb').onclick=()=>{const l=+$('bl').value;players.push({n:'Bot '+l,r:startVal(),l:0,pts:0,nd:0,bot:l});render();};
if(window.speechSynthesis)speechSynthesis.onvoiceschanged=popVoices; popVoices();
$('pk').onchange=e=>{pack={};for(const f of e.target.files)pack[f.name.replace(/\.[^.]+$/,'').toLowerCase()]=URL.createObjectURL(f);info('Wczytano nagrań: '+Object.keys(pack).length);};
$('tv').onclick=()=>speak([{num:26},{num:85},{num:140},{num:180},{key:'bust',text:L().bust,tone:'low'}]);
$('board').onclick=e=>{const x=e.target.dataset.x;if(x===undefined)return;players.splice(+x,1);if(cur>=players.length)cur=0;if(+x<cur)cur--;turnStart=players[cur].r;darts=[];over=false;bust=false;legEnd=false;pull=null;render();};

$('cal').onclick=()=>{mode='cal';cal=null;calPts=[];info(CALMSG[0]);};
$('next').onclick=nextPlayer;
$('undo').onclick=()=>{if(!darts.length)return;if(lastStat){lastStat.P.pts-=lastStat.pts;lastStat.P.nd-=lastStat.nd;lastStat=null;}if(legEnd){players[cur].l--;legEnd=false;}darts.pop();players[cur].r=turnStart;over=false;bust=false;won=false;pull=null;render();};
$('reset').onclick=()=>{players.forEach(p=>{p.r=startVal();p.l=0;p.pts=0;p.nd=0});lastStat=null;cur=0;legStarter=0;turnStart=startVal();darts=[];over=false;bust=false;won=false;legEnd=false;pull=null;snap();render();info('Nowa gra. Rzuca: '+players[0].n);if(players[0].bot)setTimeout(botTurn,1200);};
$('start').onchange=()=>$('reset').onclick();

cv.addEventListener('click',e=>{
  const b=cv.getBoundingClientRect(), x=(e.clientX-b.left)*cv.width/b.width, y=(e.clientY-b.top)*cv.height/b.height;
  if(mode==='cal'){
    calPts.push([x,y]);
    if(calPts.length<4){info(CALMSG[calPts.length]);return;}
    cal={H:homog(calPts,BP),Hi:homog(BP,calPts)}; buildRoi(); mode='play'; snap(); render();
    info('Gotowe. Sprawdź, czy zielone linie pokrywają się z tarczą (jeśli nie – kliknij „Kalibruj tarczę" i powtórz). Możesz ustawić kamerę z boku.');
  } else if(mode==='play'){ addDart(x,y); }
});

function gray(){const d=vctx.getImageData(0,0,640,480).data,g=new Uint8Array(307200);for(let i=0,j=0;j<307200;i+=4,j++)g[j]=(d[i]+d[i+1]+d[i+2])/3;return g;}
function snap(){ if(mode==='play'||cal){ref=gray();base=new Uint8Array(307200);lastN=0;stable=0;} }

function detect(){
  if(photoMode||mode!=='play'||!ref)return;
  if(pull){pullStep();return;}
  if(!$('auto').checked||darts.length>=3||over||won||players[cur].bot)return;
  const g=gray(), mask=new Uint8Array(307200), pts=[]; let n=0;
  for(let k=0;k<roi.length;k++){const i=roi[k];if(Math.abs(g[i]-ref[i])>45){mask[i]=1;if(!base[i]){n++;pts.push(i);}}}
  if(n>120&&n<8000&&Math.abs(n-lastN)<n*0.12){stable++;} else stable=0;
  lastN=n;
  if(stable>=4){
    pts.sort((a,b)=>b-a); const k=pts.slice(0,Math.max(5,pts.length*0.06|0));
    let sx=0,sy=0; k.forEach(i=>{sx+=i%640;sy+=(i/640)|0;});
    base=mask; stable=0; lastN=0; addDart(sx/k.length,sy/k.length);
  }
}
function fit(src,sw,sh){vctx.fillStyle='#000';vctx.fillRect(0,0,640,480);const k=Math.min(640/sw,480/sh),w=sw*k,h=sh*k;vctx.drawImage(src,(640-w)/2,(480-h)/2,w,h);}
function draw(){
  if(!photoMode&&v.readyState>=2&&v.videoWidth)fit(v,v.videoWidth,v.videoHeight);
  ctx.drawImage(vc,0,0);
  if(mode==='cal'){ctx.fillStyle='#0ff';calPts.forEach(p=>{ctx.beginPath();ctx.arc(p[0],p[1],6,0,7);ctx.fill();});}
  if(cal){
    ctx.lineWidth=2;
    const ring=f=>{ctx.beginPath();for(let i=0;i<=72;i++){const a=i/72*2*Math.PI,[x,y]=apply(cal.Hi,Math.sin(a)*f,-Math.cos(a)*f);i?ctx.lineTo(x,y):ctx.moveTo(x,y);}ctx.stroke();};
    ctx.strokeStyle='#0f0';[1,.953,.629,.582,.0935,.0374].forEach(ring);
    ctx.strokeStyle='#ff0';
    for(let i=0;i<20;i++){const a=(i*18-9)*Math.PI/180,[x1,y1]=apply(cal.Hi,Math.sin(a)*.0935,-Math.cos(a)*.0935),[x2,y2]=apply(cal.Hi,Math.sin(a),-Math.cos(a));ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();}
    ctx.fillStyle='#f00';darts.forEach(d=>{if(d.x===undefined)return;ctx.beginPath();ctx.arc(d.x,d.y,5,0,7);ctx.fill();});
  }
  requestAnimationFrame(draw);
}
async function startCam(){
  photoMode=false;photo=null;
  if(!window.isSecureContext||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    info('Ta strona nie ma dostępu do kamery, bo nie jest otwarta przez bezpieczny adres https:// (np. została otwarta z pliku lub z Messengera). Otwórz ją z adresu https:// albo użyj „📷 Tryb zdjęć".');return;}
  try{
    const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});
    v.srcObject=st; await v.play();
    info(mode==='play'?'Kamera działa.':'Kamera działa. '+CALMSG[calPts.length]);
  }catch(e){
    const h={NotAllowedError:'Zezwól na kamerę (ikona kłódki przy adresie → Uprawnienia) i kliknij „Włącz kamerę". Jeśli strona jest osadzona w innej aplikacji, otwórz ją w pełnym oknie przeglądarki.',NotFoundError:'Nie znaleziono kamery.',NotReadableError:'Kamera jest zajęta przez inną aplikację – zamknij ją i spróbuj ponownie.'}[e.name]||'Spróbuj ponownie lub użyj „📷 Tryb zdjęć".';
    info('Kamera niedostępna ('+e.name+'). '+h);
  }
}
$('cam').onclick=startCam;
$('phb').onclick=()=>$('ph').click();
$('ph').onchange=e=>{
  const f=e.target.files[0]; if(!f)return;
  const im=new Image(); im.onload=()=>{photoMode=true;photo=im;pull=null;fit(im,im.naturalWidth,im.naturalHeight);
    if(!cal){mode='cal';calPts=[];info('Tryb zdjęć. '+CALMSG[0]);}
    else{mode='play';info('Tryb zdjęć. Dotknij miejsc, w których wbiły się lotki. Po rundzie zrób nowe zdjęcie.');}};
  im.src=URL.createObjectURL(f); e.target.value='';
};
render(); draw(); setInterval(detect,250); startCam();
</script>
